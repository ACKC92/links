<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Music CV · Ahmet Can</title>
<meta name="description" content="Music CV of Ahmet Can — Tenor / Baritone · Conductor · Arranger &amp; Engraver · Vocal Coach">
<meta property="og:title" content="Music CV · Ahmet Can">
<meta property="og:description" content="Tenor / Baritone · Conductor · Arranger &amp; Engraver · Vocal Coach">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ackc92.github.io/links/cv.html">
<meta name="theme-color" content="#7c5cff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">

<style>
  :root{
    --accent:#7c5cff;
    --on-accent:#ffffff;
    --bg:#f5f4fa;
    --card:#ffffff;
    --text:#16141f;
    --muted:#6a6780;
    --border:rgba(22,20,31,.09);
    --shadow:0 1px 2px rgba(22,20,31,.05),0 6px 20px rgba(22,20,31,.06);
    --page-shadow:0 1px 3px rgba(22,20,31,.08),0 14px 40px rgba(22,20,31,.12);
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0e0d13;--card:#1a1823;--text:#f3f1f9;--muted:#9f9bb2;
      --border:rgba(255,255,255,.08);
      --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
      --page-shadow:0 2px 6px rgba(0,0,0,.4),0 18px 48px rgba(0,0,0,.45);
      color-scheme:dark;
    }
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh;min-height:100dvh;
    font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--text);background:var(--bg);
    -webkit-font-smoothing:antialiased;
  }

  /* Top bar */
  .bar{
    position:sticky;top:0;z-index:10;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
    padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));
    background:color-mix(in srgb,var(--bg) 82%,transparent);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }
  .bar h1{margin:0;font:600 1.1rem/1.2 ui-serif,Georgia,"Times New Roman",serif;letter-spacing:-.01em;white-space:nowrap}
  .bar .left{justify-self:start}
  .bar .right{justify-self:end}
  .btn{
    display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;
    font:inherit;font-size:.9rem;font-weight:500;line-height:1.2;text-decoration:none;white-space:nowrap;
    color:var(--text);background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);
    transition:transform .15s ease;
  }
  .btn:hover{transform:translateY(-1px)}
  .btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
  .btn svg{width:16px;height:16px;flex:none}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  @media (max-width:420px){ .btn .lbl{display:none} .btn{padding:9px} }

  /* Pages */
  .pages{
    display:flex;flex-direction:column;align-items:center;gap:18px;
    padding:20px 12px max(48px,env(safe-area-inset-bottom));
  }
  .page{position:relative;background:#fff;border-radius:3px;box-shadow:var(--page-shadow);overflow:hidden}
  .page canvas{display:block}
  .page a.lnk{position:absolute;display:block;border-radius:2px}
  .page a.lnk:hover{background:color-mix(in srgb,var(--accent) 16%,transparent)}
  .status{text-align:center;color:var(--muted);padding:56px 16px;max-width:36ch;margin:0 auto}
  .status a{color:var(--accent);font-weight:600}
</style>
</head>
<body>

<header class="bar">
  <a class="btn left" id="back" href="./" aria-label="Back to links">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg><span class="lbl" id="back-lbl">Links</span>
  </a>
  <h1 id="title">Music CV</h1>
  <a class="btn primary right" id="dl" href="Ahmet_Can_Music_CV.pdf" download aria-label="Download PDF">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 20h14"/></svg><span class="lbl" id="dl-lbl">Download</span>
  </a>
</header>

<main>
  <p class="status" id="status">Loading CV…</p>
  <div class="pages" id="pages"></div>
  <noscript><p class="status">This viewer needs JavaScript. <a href="Ahmet_Can_Music_CV.pdf">Open the PDF</a> instead.</p></noscript>
</main>

<script>
  // Language: ?lang=tr from the link page, then the visitor's last choice, then their device language
  (function () {
    var T = {
      en: { title: "Music CV", page: "Music CV · Ahmet Can", back: "Links", backAria: "Back to links",
            dl: "Download", dlAria: "Download PDF", loading: "Loading CV…",
            fail: "Couldn’t show the CV here. <a href=\"Ahmet_Can_Music_CV.pdf\">Open the PDF</a> instead.",
            old: "This browser can’t show the CV here. <a href=\"Ahmet_Can_Music_CV.pdf\">Open the PDF</a> instead.",
            page1: "CV page {n} of {total}" },
      tr: { title: "Müzik CV'si", page: "Müzik CV'si · Ahmet Can", back: "Bağlantılar", backAria: "Bağlantılara dön",
            dl: "İndir", dlAria: "PDF'i indir", loading: "CV yükleniyor…",
            fail: "CV burada gösterilemedi. Bunun yerine <a href=\"Ahmet_Can_Music_CV.pdf\">PDF'i açın</a>.",
            old: "Bu tarayıcı CV'yi burada gösteremiyor. Bunun yerine <a href=\"Ahmet_Can_Music_CV.pdf\">PDF'i açın</a>.",
            page1: "CV sayfa {n} / {total}" },
    };
    var lang = new URLSearchParams(location.search).get("lang");
    if (!T[lang]) { try { lang = localStorage.getItem("links-lang"); } catch (e) {} }
    if (!T[lang]) lang = /^tr\b/i.test(navigator.language || "") ? "tr" : "en";
    try { localStorage.setItem("links-lang", lang); } catch (e) {}
    var t = window.CV_T = T[lang];
    document.documentElement.lang = lang;
    document.title = t.page;
    document.getElementById("title").textContent = t.title;
    document.getElementById("back-lbl").textContent = t.back;
    document.getElementById("back").setAttribute("aria-label", t.backAria);
    document.getElementById("back").href = "./?lang=" + lang;
    document.getElementById("dl-lbl").textContent = t.dl;
    document.getElementById("dl").setAttribute("aria-label", t.dlAria);
    document.getElementById("status").textContent = t.loading;
  })();
</script>

<script nomodule>
  document.getElementById("status").innerHTML = window.CV_T.old;
</script>

<script type="module">
  // The CV file, uploaded next to this page
  const PDF_URL = "Ahmet_Can_Music_CV.pdf";
  // PDF.js renders the PDF inside the page, so phones and in-app browsers show it instead of downloading it
  const LIB = "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/";

  const statusEl = document.getElementById("status");
  const pagesEl = document.getElementById("pages");
  const fail = () => {
    pagesEl.replaceChildren();
    statusEl.hidden = false;
    statusEl.innerHTML = window.CV_T.fail;
  };

  let doc;
  try {
    const pdfjs = await import(LIB + "legacy/build/pdf.min.mjs");
    pdfjs.GlobalWorkerOptions.workerSrc = LIB + "legacy/build/pdf.worker.min.mjs";
    doc = await pdfjs.getDocument({
      url: PDF_URL,
      isEvalSupported: false,
      cMapUrl: LIB + "cmaps/",
      cMapPacked: true,
      standardFontDataUrl: LIB + "standard_fonts/",
      wasmUrl: LIB + "wasm/",
    }).promise;
  } catch (err) {
    console.error(err);
    fail();
  }

  let lastWidth = 0, renderId = 0;

  async function render() {
    const width = Math.min(document.documentElement.clientWidth - 24, 880);
    if (Math.abs(width - lastWidth) < 2) return;
    lastWidth = width;
    const id = ++renderId;
    const dpr = window.devicePixelRatio || 1;
    const frag = document.createDocumentFragment();
    const jobs = [];

    for (let n = 1; n <= doc.numPages; n++) {
      const page = await doc.getPage(n);
      if (id !== renderId) return;                       // a newer resize took over
      const scale = width / page.getViewport({ scale: 1 }).width;
      const css = page.getViewport({ scale });
      // extra resolution so pinch-zoom stays sharp, capped to keep phones happy
      const ratio = Math.min(dpr * 1.5, 3.5, 2600 / css.width);
      const vp = page.getViewport({ scale: scale * ratio });

      const wrap = document.createElement("div");
      wrap.className = "page";
      wrap.style.width = css.width + "px";
      wrap.style.height = css.height + "px";

      const canvas = document.createElement("canvas");
      canvas.width = Math.floor(vp.width);
      canvas.height = Math.floor(vp.height);
      canvas.style.width = css.width + "px";
      canvas.style.height = css.height + "px";
      canvas.setAttribute("role", "img");
      canvas.setAttribute("aria-label", window.CV_T.page1.replace("{n}", n).replace("{total}", doc.numPages));
      wrap.appendChild(canvas);

      // keep the PDF's own links clickable (e.g. Row, Row, Row Your Tone)
      const [a, b, c, d, e, f] = css.transform;
      for (const an of await page.getAnnotations()) {
        if (an.subtype !== "Link" || !an.url) continue;
        const [x1, y1, x2, y2] = an.rect;
        const xs = [a * x1 + c * y1 + e, a * x2 + c * y2 + e];
        const ys = [b * x1 + d * y1 + f, b * x2 + d * y2 + f];
        const link = document.createElement("a");
        link.className = "lnk";
        link.href = an.url;
        link.target = "_blank";
        link.rel = "noopener";
        link.title = an.url;
        link.style.left = Math.min(...xs) + "px";
        link.style.top = Math.min(...ys) + "px";
        link.style.width = Math.abs(xs[1] - xs[0]) + "px";
        link.style.height = Math.abs(ys[1] - ys[0]) + "px";
        wrap.appendChild(link);
      }

      frag.appendChild(wrap);
      jobs.push(page.render({ canvas, viewport: vp }).promise);
    }

    if (id !== renderId) return;
    pagesEl.replaceChildren(frag);
    statusEl.hidden = true;
    await Promise.all(jobs);
  }

  if (doc) {
    render().catch(err => { console.error(err); fail(); });
    let t;
    window.addEventListener("resize", () => {
      clearTimeout(t);
      t = setTimeout(() => render().catch(console.error), 200);
    });
  }
</script>
</body>
</html>
